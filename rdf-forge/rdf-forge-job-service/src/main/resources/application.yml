server:
  port: 8003
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: rdf-forge-job-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rdfforge}
    username: ${DB_USERNAME:rdfforge}
    password: ${DB_PASSWORD:rdfforge}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: JobHikariPool
      schema: job
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: job
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_job
    schemas: job
    default-schema: job

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    enable:
      jdbc: true
      jvm: true
      process: true
      system: true

logging:
  level:
    io.rdfforge: DEBUG
    org.springframework: INFO
    com.zaxxer.hikari: INFO
