name: RDF Forge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Backend Build & Test
  # =============================================================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rdfforge
          POSTGRES_PASSWORD: rdfforge
          POSTGRES_DB: rdfforge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn clean compile -DskipTests

    - name: Run Unit Tests
      run: mvn test -Dtest="*Test"
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rdfforge
        SPRING_DATASOURCE_USERNAME: rdfforge
        SPRING_DATASOURCE_PASSWORD: rdfforge
        SPRING_DATA_REDIS_HOST: localhost

    - name: Run Integration Tests
      run: mvn verify -P integration-tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rdfforge
        SPRING_DATASOURCE_USERNAME: rdfforge
        SPRING_DATASOURCE_PASSWORD: rdfforge

    - name: Generate Test Coverage Report
      run: mvn jacoco:report

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./**/target/site/jacoco/jacoco.xml
        fail_ci_if_error: false
        verbose: true

    - name: Package Applications
      run: mvn package -DskipTests

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-jars
        path: |
          */target/*.jar
        retention-days: 7

  # =============================================================================
  # Frontend Build & Test
  # =============================================================================
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rdf-forge-ui

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./rdf-forge-ui/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run Unit Tests
      run: npm test -- --browsers=ChromeHeadlessCI --watch=false --code-coverage

    - name: Check Test Coverage
      run: |
        COVERAGE=$(cat coverage/rdf-forge-ui/coverage-summary.json | jq -r '.total.lines.pct')
        echo "Total coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 70" | bc -l) )); then
          echo "Coverage $COVERAGE% is below 70%"
          exit 1
        fi

    - name: Build Production
      run: npm run build -- --configuration production

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: ./rdf-forge-ui/dist/
        retention-days: 7

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run npm audit
      working-directory: ./rdf-forge-ui
      run: npm audit --audit-level=moderate
      continue-on-error: true

  # =============================================================================
  # Build & Push Docker Images
  # =============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, security-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - rdf-forge-gateway
          - rdf-forge-pipeline-service
          - rdf-forge-shacl-service
          - rdf-forge-job-service
          - rdf-forge-data-service
          - rdf-forge-dimension-service
          - rdf-forge-triplestore-service

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          SERVICE_NAME=${{ matrix.service }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # =============================================================================
  # E2E Tests
  # =============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./rdf-forge-ui/package-lock.json

    - name: Install Playwright
      working-directory: ./rdf-forge-ui
      run: |
        npm ci
        npx playwright install --with-deps

    - name: Start services
      run: docker-compose -f docker-compose.yml up -d

    - name: Wait for services
      run: |
        chmod +x ./scripts/wait-for-services.sh
        ./scripts/wait-for-services.sh

    - name: Run E2E Tests
      working-directory: ./rdf-forge-ui
      run: npx playwright test
      env:
        CI: true

    - name: Upload E2E Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: ./rdf-forge-ui/playwright-report/
        retention-days: 30

    - name: Stop services
      if: always()
      run: docker-compose -f docker-compose.yml down

  # =============================================================================
  # Deploy to Staging
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, e2e-tests]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.rdfforge.local

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

    - name: Deploy to Staging
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          cd /opt/rdf-forge
          docker-compose -f docker-compose.production.yml pull
          docker-compose -f docker-compose.production.yml up -d
          docker-compose -f docker-compose.production.yml ps
        EOF

  # =============================================================================
  # Deploy to Production
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, e2e-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://rdfforge.local

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

    - name: Deploy to Production
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/rdf-forge
          
          # Backup current state
          docker-compose -f docker-compose.production.yml exec -T postgres pg_dump -U rdfforge rdfforge > backup-$(date +%Y%m%d-%H%M%S).sql
          
          # Pull new images
          docker-compose -f docker-compose.production.yml pull
          
          # Rolling update
          docker-compose -f docker-compose.production.yml up -d --no-deps --scale gateway=3 gateway
          docker-compose -f docker-compose.production.yml up -d --no-deps --scale pipeline-service=3 pipeline-service
          docker-compose -f docker-compose.production.yml up -d --no-deps --scale job-service=3 job-service
          docker-compose -f docker-compose.production.yml up -d
          
          # Health check
          sleep 30
          docker-compose -f docker-compose.production.yml ps
          curl -f http://localhost:8000/actuator/health || exit 1
        EOF

    - name: Notify Deployment
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "RDF Forge ${{ github.ref_name }} deployed to production",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*RDF Forge ${{ github.ref_name }}* successfully deployed to production :rocket:"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
