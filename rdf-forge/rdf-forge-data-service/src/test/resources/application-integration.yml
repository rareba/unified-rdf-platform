# Configuration for integration tests using a PostgreSQLContainer.
# Most datasource properties are overridden at runtime via @DynamicPropertySource.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rdfforge_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      schema:
      pool-name: IntegrationTestPool
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema:

  flyway:
    enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Disable MinIO auto-configuration — not needed for repository slice tests
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: rdf-forge-data

logging:
  level:
    root: WARN
    io.rdfforge: DEBUG
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO
