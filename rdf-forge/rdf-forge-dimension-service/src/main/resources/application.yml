server:
  port: 8005
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: rdf-forge-dimension-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rdfforge}
    username: ${DB_USERNAME:rdfforge}
    password: ${DB_PASSWORD:rdfforge}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DimensionHikariPool
      schema: dimension
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: dimension
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_dimension
    schemas: dimension
    default-schema: dimension

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    enable:
      jdbc: true
      jvm: true
      process: true
      system: true

logging:
  level:
    io.rdfforge: DEBUG
    org.springframework: INFO
    com.zaxxer.hikari: INFO

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      shaclService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      pipelineService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      shaclService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
      pipelineService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException

# Service URLs
services:
  shacl-service:
    url: http://localhost:8002
  pipeline-service:
    url: http://localhost:8001
