# =============================================================================
# RDF Forge - Production Deployment Configuration
# =============================================================================
# This file is optimized for production deployment with:
# - Resource limits and reservations
# - Health checks for all services
# - Restart policies
# - Read-only filesystems where possible
# - Non-root users
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: rdf-forge-postgres
    environment:
      POSTGRES_DB: rdfforge
      POSTGRES_USER: rdfforge
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_MULTIPLE_DATABASES: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/01-create-dbs.sh:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdfforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: false  # PostgreSQL needs write access to data directory

  redis:
    image: redis:7-alpine
    container_name: rdf-forge-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-rdfforge_redis} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: rdf-forge-minio
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - ./docker/secrets/minio-secret.txt:/run/secrets/minio_password:ro
    ports:
      - "9000:9000"
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rdf-forge-gateway
    container_name: rdf-forge-gateway
    ports:
      - "8000:8000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PIPELINE_SERVICE_URL: http://pipeline-service:8001
      SHACL_SERVICE_URL: http://shacl-service:8002
      JOB_SERVICE_URL: http://job-service:8003
      DATA_SERVICE_URL: http://data-service:8004
      DIMENSION_SERVICE_URL: http://dimension-service:8005
      TRIPLESTORE_SERVICE_URL: http://triplestore-service:8006
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/rdfforge
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/rdfforge/protocol/openid-connect/certs
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms512m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"

  pipeline-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rdf-forge-pipeline-service
    container_name: rdf-forge-pipeline-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rdfforge
      SPRING_DATASOURCE_USERNAME: rdfforge
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms512m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    volumes:
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"

  shacl-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rdf-forge-shacl-service
    container_name: rdf-forge-shacl-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rdfforge
      SPRING_DATASOURCE_USERNAME: rdfforge
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms512m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    volumes:
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"

  job-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rdf-forge-job-service
    container_name: rdf-forge-job-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rdfforge
      SPRING_DATASOURCE_USERNAME: rdfforge
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      SPRING_DATA_REDIS_HOST: redis
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms512m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    volumes:
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"

  data-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rdf-forge-data-service
    container_name: rdf-forge-data-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rdfforge
      SPRING_DATASOURCE_USERNAME: rdfforge
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_password
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms512m
        -Xmx1.5g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    volumes:
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
      - ./docker/secrets/minio-secret.txt:/run/secrets/minio_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8004/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    user: "1000:1000"

  dimension-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rdf-forge-dimension-service
    container_name: rdf-forge-dimension-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rdfforge
      SPRING_DATASOURCE_USERNAME: rdfforge
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      SHACL_SERVICE_URL: http://shacl-service:8002
      PIPELINE_SERVICE_URL: http://pipeline-service:8001
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms512m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    volumes:
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8005/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"

  triplestore-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rdf-forge-triplestore-service
    container_name: rdf-forge-triplestore-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rdfforge
      SPRING_DATASOURCE_USERNAME: rdfforge
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms512m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    volumes:
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8006/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"

  ui:
    build:
      context: ./rdf-forge-ui
      dockerfile: Dockerfile
    container_name: rdf-forge-ui
    ports:
      - "80:80"
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=10m
    user: "1000:1000"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: rdf-forge-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: rdfforge
      KC_DB_PASSWORD_FILE: /run/secrets/db_password
      KC_LOG_LEVEL: INFO
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./docker/secrets/db-password.txt:/run/secrets/db_password:ro
      - ./docker/secrets/keycloak-password.txt:/run/secrets/keycloak_password:ro
    networks:
      - rdf-forge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.25'
          memory: 512M
      replicas: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"
    # Production: uses optimized startup mode with TLS and security defaults
    command: start --optimized --import-realm

networks:
  rdf-forge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
